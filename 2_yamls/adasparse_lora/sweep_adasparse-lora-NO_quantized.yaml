seed: 50
use_gpu: True
device: 0

outdir: exp_standalone/adasparse_lora

debug: False

federate:
  mode: standalone
  method: adasparse_lora #adasparse_lora method
  client_num: 12
  total_round_num: 20
  save_to: "ckpt/adasparse_lora.ckpt"
  online_aggr: False
  ignore_weight: False
  share_local_model: False
  communication: 
    network_trace_distribution:
      static: 0.0
      pedestrian: 0.0
      bus: 0.0
      static_extended: 0.0
      pedestrian_extended: 0.0

data:
  root: data/
  type: 'sst2@glue'
  splits: [0.90, 0.10]
  splitter: 'iid'

dataloader:
  batch_size: 32

model:
  type: 'microsoft/deberta-large@huggingface_llm'
  task: 'SequenceClassification'
  out_channels: 2

trainer:
  type: gluetrainer

train:  
  local_update_steps: 30  
  batch_or_epoch: batch  
  optimizer:    
    type: AdamW    
    lr: 0.0005    
    weight_decay: 0.01  
  scheduler:    
    type: CosineAnnealingLR    
    T_max: 20  # To match the total FL rounds  
  is_enable_half: False  # DeBERTa works better in fp32, but run in half precision to accommodate more clients

criterion:
  type: CrossEntropyLoss

eval:
  freq: 5
  metrics: ['acc', 'f1', 'loss']
  split: ['val']
  report: ['weighted_avg']
  best_res_update_round_wise_key: val_acc
  count_flops: False

###############################################################################
# GLUE-specific settings
###############################################################################
glue:
  max_length: 128
  retry_on_nan_loss: True

  adapter:
    use: True
    mv_to_cpu: False # Keep only the active client’s model on GPU
    
    args:
      - adapter_package: peft
        adapter_method: lora
        target_modules: ['attention.self.in_proj', 'attention.output.dense', 
                          'intermediate.dense', 'output.dense']
        r: 8
        lora_alpha: 16
        lora_dropout: 0.05
    base_quant:
      enabled: True
      distribution:
        '4': 0
        '8': 0
        '16': 1
        '32': 0
      lora_dtype: fp32  # LoRA modules dtype (fp32 as per paper)

    max_rank: 200  # Smaller max for memory efficiency
    hetero_strategy: heavy_tail
    hetero_ranks: {}
    hetero_alpha: {}
    hetero_target_modules: {}

    fah:
      enabled: False 

    hetlora:
      enabled: False

    adasparse_lora:
      enabled: True
      rank_min: 4
      rank_max: 200
      init_rank: 64
      pruning:
        enabled: True
        gamma: 0.99              # Equivalent to HetLoRA tail fraction & pruning intensity (paper gamma)
        regularizer_weight: 0.001
      aggregation:
        mode: sparsity_weighted  # or sample_size

###############################################################################
# LLM adapter config (for compatibility)
###############################################################################
llm:
  tok_len: 128
  
  adapter:
    use: True
    mv_to_cpu: False
    
    args:
      - adapter_package: peft
        adapter_method: lora
        # Must match glue.adapter.args.target_modules for DeBERTa-large
        target_modules: ['attention.self.in_proj', 'attention.output.dense',
                         'intermediate.dense', 'output.dense']
        r: 8
        lora_alpha: 16
        lora_dropout: 0.05
    # Heterogeneous Base Model Quantization (must match glue.adapter.fah.base_quant)
    base_quant:
      enabled: False
      distribution:
        '4': 0
        '8': 0
        '16': 1
        '32': 0
      lora_dtype: fp32

    max_rank: 200
    hetero_strategy: heavy_tail
    hetero_ranks: {}
    hetero_alpha: {}
    hetero_target_modules: {}

    fah:
      enabled: False 

    hetlora:
      enabled: False

    adasparse_lora:
      enabled: True
      rank_min: 4
      rank_max: 200
      init_rank: 64
      pruning:
        enabled: True
        gamma: 0.99              # Equivalent to HetLoRA tail fraction & pruning intensity (paper gamma)
        regularizer_weight: 0.001
      aggregation:
        mode: sparsity_weighted  # or sample_size