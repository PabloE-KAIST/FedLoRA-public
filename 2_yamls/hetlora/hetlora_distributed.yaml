# HetLoRA — Distributed 12-client fleet
# Based on hetlora-NO_quantized.yaml, adapted for relay-mode deployment.
# Rank budgets set from memory profiling (Prereq D, 2026-04-24).
seed: 50
use_gpu: True
device: 2

outdir: exp_distributed/hetlora

debug: False

federate:
  mode: distributed
  method: hetlora
  client_num: 12
  total_round_num: 20
  sample_client_num: 12
  online_aggr: False
  ignore_weight: False
  share_local_model: False
  communication:
    source: tc_json
    mode: dynamic
    tc_json_ul_path: 1_scripts/distributed/generated_bandwidths/bandwidth_limits_ul.json
    tc_json_dl_path: 1_scripts/distributed/generated_bandwidths/bandwidth_limits_dl.json
    uplink_min_mbps: 1.2
    uplink_max_mbps: 4.2
    downlink_mbps: 30.1

distribute:
  server_host: "${FEDLORA_CONTROLLER_IP:?set FEDLORA_CONTROLLER_IP}"
  server_port: 60001

data:
  root: data/
  type: 'sst2@glue'
  splits: [0.90, 0.10]
  splitter: 'iid'
  splitter_args:
    - alpha: 1.0

dataloader:
  batch_size: 32
  num_workers: 0

model:
  type: /workspace/models/deberta-large@huggingface_llm
  model_type: microsoft/deberta-large
  task: 'SequenceClassification'
  out_channels: 2

trainer:
  type: gluetrainer

train:
  local_update_steps: 30
  batch_or_epoch: batch
  optimizer:
    type: AdamW
    lr: 0.0005
    weight_decay: 0.01
  scheduler:
    type: CosineAnnealingLR
    T_max: 20
  is_enable_half: False

criterion:
  type: CrossEntropyLoss

eval:
  freq: 5
  metrics: ['acc', 'f1', 'loss', 'mcc', 'pearson']
  split: ['val']
  report: ['weighted_avg']
  best_res_update_round_wise_key: val_acc
  count_flops: False

glue:
  max_length: 128
  retry_on_nan_loss: True

  adapter:
    use: True
    mv_to_cpu: False

    args:
      - adapter_package: peft
        adapter_method: lora
        target_modules: ['attention.self.in_proj', 'attention.output.dense',
                         'intermediate.dense', 'output.dense']
        r: 8
        lora_alpha: 16
        lora_dropout: 0.05

    base_quant:
      enabled: True
      distribution:
        '4': 0
        '8': 0
        '16': 1
        '32': 0
      lora_dtype: fp32

    max_rank: 200
    hetero_strategy: distributed_fleet
    manifest_path: distributed/configs/client_manifest.json
    hetero_ranks: {}
    hetero_alpha: {}
    hetero_target_modules: {}

    fah:
      enabled: False

    hetlora:
      enabled: True
      rank_min: 4
      rank_max: 200
      init_rank: 64
      pruning:
        enabled: True
        decay: 0.99
        regularizer_weight: 0.001
      aggregation:
        mode: sparsity_weighted

    adasparse_lora:
      enabled: False
    adasparse_lorav2:
      enabled: False

llm:
  tok_len: 128

  adapter:
    use: True
    mv_to_cpu: False

    args:
      - adapter_package: peft
        adapter_method: lora
        target_modules: ['attention.self.in_proj', 'attention.output.dense',
                         'intermediate.dense', 'output.dense']
        r: 8
        lora_alpha: 16
        lora_dropout: 0.05

    base_quant:
      enabled: False
      distribution:
        '4': 0
        '8': 0
        '16': 1
        '32': 0
      lora_dtype: fp32

    max_rank: 200
    hetero_strategy: distributed_fleet
    manifest_path: distributed/configs/client_manifest.json
    hetero_ranks: {}
    hetero_alpha: {}
    hetero_target_modules: {}

    fah:
      enabled: False

    hetlora:
      enabled: True
      rank_min: 4
      rank_max: 200
      init_rank: 64
      pruning:
        enabled: True
        decay: 0.99
        regularizer_weight: 0.001
      aggregation:
        mode: sparsity_weighted

    adasparse_lora:
      enabled: False
    adasparse_lorav2:
      enabled: False
